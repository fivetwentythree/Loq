name: Loq
options:
  bundleIdPrefix: local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Loq:
    type: application
    platform: macOS
    sources:
      - path: Loq
        excludes: [Info.plist, Loq.entitlements]
    info:
      path: Loq/Info.plist
      properties:
        CFBundleDisplayName: Loq
        LSApplicationCategoryType: public.app-category.developer-tools
        NSMotionUsageDescription: Loq reads AirPods head-motion data to study whether mouthed words can be decoded into text.
        NSMicrophoneUsageDescription: Loq records microphone audio alongside motion data and transcribes whispered speech for comparison.
        NSSpeechRecognitionUsageDescription: Loq transcribes microphone audio on-device as a reference for the motion decoder.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.subvox
        CODE_SIGN_ENTITLEMENTS: Loq/Loq.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  LoqTests:
    type: bundle.unit-test
    platform: macOS
    sources: [LoqTests]
    dependencies:
      - target: Loq
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.subvox.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Loq:
    build:
      targets:
        Loq: all
        LoqTests: [test]
    test:
      targets: [LoqTests]
